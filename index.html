<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5e526f" />
    <meta name="description" content="Take the controls of a vintage seaplane and fly freely over a golden sunset sea." />
    <title>run free. — Take to the skies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="experience" aria-label="Two vintage seaplanes flying over a golden sea at sunset">
      <div class="fallback" aria-hidden="true"><div class="fallback-sun"></div><div class="fallback-sea"></div></div>
      <canvas id="scene" aria-label="Player-controlled sunset flight" aria-describedby="flight-help" role="img"></canvas>
      <div class="film" aria-hidden="true"></div>
      <div class="title"><h1>run free.</h1><div class="title-rule" aria-hidden="true"></div></div>
      <p id="flight-help" class="flight-help"><span class="desktop-help">WASD / ↑↓←→ · steer &amp; climb <span>SHIFT · boost &nbsp; SPACE · pause &nbsp; R · reset</span></span><span class="touch-help">Drag to fly · hold ↟ to boost</span></p>
      <div class="touch-controls"><div id="joystick" role="group" aria-label="Flight joystick: drag left or right to turn, up to climb, down to descend"><span class="stick-cross" aria-hidden="true"></span><span class="stick-knob" aria-hidden="true"></span></div><button id="boost" aria-label="Hold to boost" title="Hold to boost"><svg viewBox="0 0 24 24"><path d="m6 13 6-6 6 6m-12 6 6-6 6 6"/></svg></button></div>
      <footer class="footer"><div class="controls"><button id="reset" aria-label="Reset flight" title="Reset · R"><svg viewBox="0 0 24 24"><path d="M5 9a7 7 0 1 1 0 6M5 4v5h5"/></svg></button><button id="pause" aria-label="Pause flight" title="Pause · Space"><svg id="pause-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg><svg id="play-icon" viewBox="0 0 24 24" hidden><path d="m9 5 10 7-10 7Z"/></svg></button><span class="control-divider"></span><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button></div></footer>
      <div id="status" role="status" class="sr-only"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
